function backlogRows_(D) {

/* ---------- API: Greasing achievement (Greasing_Plan = schedule rules, Greasing_Log = what was done) ---------- */
var GREASE_TOL = 1;   // a log entry within +/- this many days of a planned day counts as that plan being done
function apiGreasing(ym) {
  var S = settings_(), asof = iso_(S['Period_End']) || Utilities.formatDate(new Date(), tz_(), 'yyyy-MM-dd');
  var pl = table_('Greasing_Plan'), lg = table_('Greasing_Log'), pn = 'Greasing_Plan', ln = 'Greasing_Log';
  var cp = { u: col_(pl, 'Unit', pn), t: col_(pl, 'Tabel', pn), s: col_(pl, 'Start_Day', pn), i: col_(pl, 'Interval_Days', pn), k: col_(pl, 'Kg_Per_Greasing', pn),
    a: col_(pl, 'Active', pn), x: 'Plan_Days' in pl.ix ? pl.ix['Plan_Days'] : -1 };
  var cl = { d: col_(lg, 'Date', ln), u: col_(lg, 'Unit', ln), q: col_(lg, 'Qty_Kg', ln) };
  // months available: first logged month .. as-of month

    logs.push({ u: u, d: d, q: num_(r[cl.q]) }); mset[d.slice(0, 7)] = 1;
  });

  var mk = Object.keys(mset).sort(), first = mk[0], cur = first, months = [];
  while (cur <= asof.slice(0, 7)) {

    var yy = +cur.slice(0, 4), mm = +cur.slice(5, 7) + 1; if (mm > 12) { mm = 1; yy++; }

  var rows = [], cnt = {};

    var tb = str_(r[cp.t]) || 'OTHER', kg = num_(r[cp.k]), plan = [];

    else { var st = num_(r[cp.s]) || 1, iv = num_(r[cp.i]) || 7; for (var d = st; d <= dim; d += iv) plan.push(d); }

      if (best) { best.used = true; days[p] = 2; done++; }

   "foto" keeps your PNG files from GitHub; the other styles are drawn here as SVG. */
var IMG_DEFAULT='foto';
(function(){
 var W=function(x,y,r){return'<circle class="d" cx="'+x+'" cy="'+y+'" r="'+r+'"/><circle class="m" cx="'+x+'" cy="'+y+'" r="'+Math.round(r/2.6)+'"/>'};

  gd:'<rect class="b" x="40" y="82" width="166" height="10" rx="3"/><path class="b2" d="M46 82V50h52v32z"/><path class="g" d="M52 78V56h40v22z"/><path class="m" d="M44 44h60v6H44z"/><path class="b" d="M102 62h36v20h-36z"/><path class="m" d="M122 104h62v9H122z"/><path class="ln" d="M130 92l-4 12M176 92l6 12"/>'+W(54,108,16)+W(90,108,16)+W(204,110,14)
 };
 var CSS={
  ilustrasi:'.b{fill:#f2b705;stroke:#0b0f16;stroke-width:.9}.b2{fill:#d99a00;stroke:#0b0f16;stroke-width:.9}.g{fill:#cfe8f3;stroke:#0b0f16;stroke-width:.9}.d{fill:#5b6573;stroke:#0b0f16;stroke-width:.9}.m{fill:#aab4c2;stroke:#0b0f16;stroke-width:.9}.ln{fill:none;stroke:#0b0f16;stroke-width:.9;opacity:.7}.arm{fill:none;stroke:#aab4c2;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}',

 };
 function uri(art,style){var s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140"><style>'+CSS[style]+'</style>'+art+'</svg>';return'url("data:image/svg+xml;utf8,'+encodeURIComponent(s)+'")'}
 window.applyImg=function(m){var r=document.documentElement.style;
  if(m=='foto'){r.removeProperty('--img-pc');r.removeProperty('--img-gd')}
  else if(m=='none'){r.setProperty('--img-pc','none');r.setProperty('--img-gd','none')}
  else{r.setProperty('--img-pc',uri(ART.pc,m));r.setProperty('--img-gd',uri(ART.gd,m))}
  var s=document.getElementById('imsel');if(s)s.value=m;if(m=='foto'||m=='none')document.documentElement.removeAttribute('data-img');else document.documentElement.setAttribute('data-img',m);try{localStorage.setItem('pms-img',m)}catch(e){}};
 var m=IMG_DEFAULT;try{var q=localStorage.getItem('pms-img');if(q&&CSS[q]||q=='foto'||q=='none')m=q}catch(e){}
 var sel=document.getElementById('imsel');if(!sel.querySelector('option[value="'+m+'"]'))m=IMG_DEFAULT;
 sel.onchange=function(){applyImg(sel.value)};applyImg(m);
})();
